        <script>
    function toggleMenu() {
        document.getElementById("burger-menu").classList.toggle("show");
    }

    document.getElementById("form-inscription").addEventListener("submit", async function(e) {
        e.preventDefault();

        const d = {
            nom:                this.nom.value,
            prenom:             this.prenom.value,
            email:              this.email.value,
            adresse_principale: this.ville.value, 
            lieu_naissance:     this.lieu_naissance.value,
            groupe:             this.groupe.value
        };

        try {
            const r = await fetch("/api/inscription", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(d)
            });

            if (r.ok) { 
                alert("Inscription réussie !"); 
                this.reset(); 
                window.location.href = "recherche.html";
            } else { 
                alert("Erreur lors de l'inscription."); 
            }
        } catch (error) {
            alert("Le serveur ne répond pas.");
        }
    });
